name: Build GnuPG macOS DMGs

on:
  workflow_dispatch:
    inputs:
      gnupg_version:
        description: 'Official GnuPG version, for example 2.5.24'
        required: true
        type: string
        default: '2.5.24'

permissions:
  contents: read

concurrency:
  group: gnupg-dmg-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      GNUPG_VERSION: ${{ inputs.gnupg_version }}
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Validate requested GnuPG version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GNUPG_VERSION" =~ ^2\.(4|5)\.[0-9]+$ ]]; then
            echo 'Only official GnuPG 2.4.x / 2.5.x release versions are supported.' >&2
            exit 1
          fi

      - name: Prepare runner temporary directories
        shell: bash
        run: |
          set -euo pipefail
          printf 'GPGOSX_WORKDIR=%s\n' "$RUNNER_TEMP/gnupg-work" >> "$GITHUB_ENV"
          printf 'GPGOSX_DOWNLOADDIR=%s\n' "$RUNNER_TEMP/gnupg-download" >> "$GITHUB_ENV"
          printf 'SOURCE_DIR=%s\n' "$RUNNER_TEMP/gpgosx-source" >> "$GITHUB_ENV"

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install pkgconf gnupg autoconf automake libtool gettext lzip ncurses
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          clang --version

      - name: Check Homebrew wide-character ncurses toolchain
        shell: bash
        run: |
          set -euo pipefail
          ncurses_prefix="$(brew --prefix ncurses)"
          test -f "$ncurses_prefix/include/ncursesw/curses.h" || {
            echo 'Homebrew ncursesw headers are missing.' >&2; exit 1;
          }
          test -f "$ncurses_prefix/lib/libncursesw.a" || {
            echo 'Homebrew static libncursesw.a is missing.' >&2; exit 1;
          }
          printf 'GPGOSX_NCURSES_PREFIX=%s\n' "$ncurses_prefix" >> "$GITHUB_ENV"
          echo "Using static wide-character ncurses from $ncurses_prefix"

      - name: Retrieve macOS build machinery
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://git.code.sf.net/p/gpgosx/source "$SOURCE_DIR"
          # The audited upstream build system is archived. Do not silently
          # switch to an unreviewed future commit.
          actual="$(git -C "$SOURCE_DIR" rev-parse HEAD)"
          if [[ "$actual" != eb61c5* ]]; then
            echo "Unexpected GnuPG for OS X revision: $actual" >&2
            exit 1
          fi
          test -f "$SOURCE_DIR/build.sh"
          test -f "$SOURCE_DIR/common.sh"
          test -f "$SOURCE_DIR/scripts/convert-keyring"
          mkdir -p "$GPGOSX_WORKDIR" "$GPGOSX_DOWNLOADDIR" "$SOURCE_DIR/logs"

      - name: Adapt legacy build for SQLite, libgcrypt TLS, and Pinentry ncursesw
        shell: bash
        run: |
          set -euo pipefail
          # The legacy gpgosx script always adds --host, even for native
          # compilation. SQLite 3.54.x uses Autosetup and searches for
          # aarch64-apple-darwin-cc or x86_64-apple-darwin-cc as a result.
          # Keep --host for other libraries; remove it only for SQLite.
          python3 - "$SOURCE_DIR/build.sh" <<'PYTHON'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          original = path.read_text()
          before = '\tcfopts=(--host="$HOSTTYPE" --prefix="$GPGOSX_DISTDIR" --disable-doc)\n'
          after = """\tif [[ "$libname" == sqlite-autoconf ]]; then
          \t\t# Both macOS runners build natively for their target architecture.
          \t\t[[ "$(uname -m)" == "$ARCH" ]] || die "SQLite requires a native $ARCH runner"
          \t\tcfopts=(--prefix="$GPGOSX_DISTDIR")
          \t\t# Supply Apple's LLVM/Clang explicitly to SQLite Autosetup.
          \t\tcfenv+=(CC="$CC" CXX="$CXX" CC_FOR_BUILD="$CC_FOR_BUILD")
          \telse
          \t\tcfopts=(--host="$HOSTTYPE" --prefix="$GPGOSX_DISTDIR" --disable-doc)
          \tfi
          """
          if original.count(before) != 1:
              raise SystemExit('Unexpected upstream build.sh layout; refusing unsafe patch')
          original = original.replace(before, after, 1)

          # Pinentry may detect Apple's ncursesw via pkg-config, while still
          # compiling against the SDK's narrow /usr/include/curses.h.  Pass a
          # matching Homebrew wide-character header AND static library, so the
          # installed DMG does not depend on /opt/homebrew or a Homebrew Cellar.
          pinentry_hook = '\tbuild_log "Configure $lib"\n'
          pinentry_config = '''\tif [[ "$libname" == pinentry ]]; then
          \t\t: "${GPGOSX_NCURSES_PREFIX:?Missing Homebrew ncurses prefix}"
          \t\tncurses_include="$GPGOSX_NCURSES_PREFIX/include/ncursesw"
          \t\tncurses_archive="$GPGOSX_NCURSES_PREFIX/lib/libncursesw.a"
          \t\t[[ -f "$ncurses_include/curses.h" && -f "$ncurses_archive" ]] ||
          \t\t\tdie 'Missing matching wide-character ncurses headers/static archive'
          \t\tcfenv+=(NCURSES_CFLAGS="-I$ncurses_include" NCURSES_LIBS="$ncurses_archive")
          \t\tcfopts+=(--with-ncurses-include-dir="$ncurses_include"
          \t\t         --enable-pinentry-curses --enable-pinentry-tty)
          \tfi
          '''
          if original.count(pinentry_hook) != 1:
              raise SystemExit('Could not safely locate pinentry configure hook')
          original = original.replace(pinentry_hook, pinentry_config + pinentry_hook, 1)

          # Abort immediately if libgcrypt's configure falsely detects no TLS.
          # Otherwise the subsequent src/fips.c compilation fails with a
          # misleading 'requires thread-local storage' error.
          configure_line = ('\tenv "${cfenv[@]}" ./configure "${cfopts[@]}"'
                            ' || die "Failed to configure $lib (cstep $cstep)"\n')
          check_tls = '''\tif [[ "$libname" == libgcrypt ]]; then
          \t\tif ! grep -Eq '^#define HAVE_GCC_STORAGE_CLASS__THREAD 1$' config.h; then
          \t\t\techo 'libgcrypt configure did not detect __thread support' >&2
          \t\t\tgrep -n 'gcry_cv_gcc_storage_class__thread' config.log | tail -5 || true
          \t\t\tdie 'libgcrypt TLS configure probe failed; inspect config.log'
          \t\tfi
          \tfi
          '''
          if original.count(configure_line) != 1:
              raise SystemExit('Unexpected upstream libgcrypt configure command; refusing patch')
          # Refuse to build against mismatched curses headers and libraries.
          # Pinentry's configure check must actually enable the wide API and
          # its generated Makefile must use the static archive requested above.
          check_pinentry = '''\tif [[ "$libname" == pinentry ]]; then
          \t\tgrep -Eq '^#define HAVE_NCURSESW 1$' config.h ||
          \t\t\tdie 'Pinentry did not detect wide-character ncurses'
          \t\tgrep -Fq "$GPGOSX_NCURSES_PREFIX/include/ncursesw" pinentry/Makefile ||
          \t\t\tdie 'Pinentry Makefile does not use Homebrew ncursesw headers'
          \t\tgrep -Fq "$GPGOSX_NCURSES_PREFIX/lib/libncursesw.a" pinentry/Makefile ||
          \t\t\tdie 'Pinentry Makefile does not link static ncursesw'
          \tfi
          '''
          path.write_text(original.replace(configure_line,
              configure_line + check_tls + check_pinentry, 1))
          print('Patched SQLite configure, libgcrypt TLS check, and Pinentry ncursesw')
          PYTHON
          # Apple Clang 16.4 emits -Wdeprecated-ofast. libgcrypt configure.ac
          # enables -Werror for feature probes (including __thread), so the
          # warning would otherwise produce a false negative for TLS support.
          # -O3 also avoids -ffast-math for a cryptographic library.
          python3 - "$SOURCE_DIR/config-rel.sh" <<'PYTHON'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          data = path.read_text()
          for arch in ('ARM', 'X86'):
              old = f'{arch}_FLAGS+=" -Ofast"'
              new = f'{arch}_FLAGS+=" -O3"'
              if data.count(old) != 1:
                  raise SystemExit(f'Unexpected optimization flags for {arch}')
              data = data.replace(old, new, 1)
          path.write_text(data)
          print('Switched release optimization to -O3 for ARM64 and x86_64')
          PYTHON
          bash -n "$SOURCE_DIR/build.sh"
          bash -n "$SOURCE_DIR/config-rel.sh"

      - name: Update dependencies and disable upstream's unconfigured signing
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          # Latest upstream stable library releases checked on 2026-10-25.
          # Preserve build order required by the original GnuPG for OS X script.
          # SQLite needs a SHA-1 value for this legacy script; it is also
          # independently checked against SQLite's published SHA3-256 below.
          cat > libraries <<'LIBRARIES'
          https://ftp.gnu.org/gnu/libiconv/libiconv-1.19.tar.gz|sig
          https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.lz|sig
          https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-1.61.tar.bz2|sig
          https://gnupg.org/ftp/gcrypt/libassuan/libassuan-3.0.2.tar.bz2|sig
          https://gnupg.org/ftp/gcrypt/libksba/libksba-1.8.1.tar.bz2|sig
          https://ftp.gnu.org/gnu/readline/readline-8.3.tar.gz|sig
          https://gnupg.org/ftp/gcrypt/npth/npth-1.8.tar.bz2|sig
          https://www.sqlite.org/2026/sqlite-autoconf-3540100.tar.gz|87a0ad77300ee86a06d54cd3d2b5a7274214d6ba
          https://gnupg.org/ftp/gcrypt/libgcrypt/libgcrypt-1.12.4.tar.bz2|sig
          https://gnupg.org/ftp/gcrypt/ntbtls/ntbtls-0.3.2.tar.bz2|sig
          https://gnupg.org/ftp/gcrypt/gpgme/gpgme-2.2.0.tar.bz2|sig
          https://gnupg.org/ftp/gcrypt/pinentry/pinentry-1.3.3.tar.bz2|sig
          LIBRARIES
          # The workflow verifies the GnuPG release tarball explicitly below.
          # Legacy library signature verification cannot work on a fresh runner
          # without the different upstream library maintainers' public keys.
          sed -i '' 's/^GPGOSX_EXISTING_BINARY=gpg$/GPGOSX_EXISTING_BINARY=/' common.sh
          sed -i '' 's/^DMG_SIGNING_KEY=.*/DMG_SIGNING_KEY=/' common.sh
          grep -qx 'GPGOSX_EXISTING_BINARY=' common.sh
          grep -qx 'DMG_SIGNING_KEY=' common.sh

      - name: Download and authenticate SQLite source
        shell: bash
        run: |
          set -euo pipefail
          sqlite_file="$GPGOSX_DOWNLOADDIR/sqlite-autoconf-3540100.tar.gz"
          curl --fail --location --retry 4 --silent --show-error \
            --output "$sqlite_file" \
            https://www.sqlite.org/2026/sqlite-autoconf-3540100.tar.gz
          # This hash is published on sqlite.org/download.html for SQLite 3.54.1.
          # Perform SHA3-256 validation in addition to the legacy SHA-1 check.
          python3 - "$sqlite_file" <<'PYTHON'
          import hashlib
          import pathlib
          import sys

          expected = 'b6ced585c750916b1052667239a12c25a7ff34e7f06e1e6e01ecb0427657d9c4'
          path = pathlib.Path(sys.argv[1])
          actual = hashlib.sha3_256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'SQLite SHA3-256 mismatch: {actual}')
          print(f'Verified SQLite SHA3-256: {actual}')
          PYTHON

      - name: Download and authenticate official GnuPG release
        shell: bash
        run: |
          set -euo pipefail
          source_url="https://gnupg.org/ftp/gcrypt/gnupg/gnupg-${GNUPG_VERSION}.tar.bz2"
          source_file="$GPGOSX_DOWNLOADDIR/gnupg-${GNUPG_VERSION}.tar.bz2"
          curl --fail --location --retry 4 --silent --show-error -o "$source_file" "$source_url"
          curl --fail --location --retry 4 --silent --show-error -o "$source_file.sig" "$source_url.sig"
          curl --fail --location --retry 4 --silent --show-error -o "$RUNNER_TEMP/gnupg-signing-keys.asc" \
            https://gnupg.org/signature_key.asc
          export GNUPGHOME="$RUNNER_TEMP/gnupg-verify-home"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import "$RUNNER_TEMP/gnupg-signing-keys.asc"
          # Pin the release-signing identities documented by GnuPG.
          allowed='^(6DAA6E64A76D2840571B4902528897B826403ADA|AC8E115BF73E2D8D47FA9908E98E9B2D19C6C8BD|3B761AE4E63BF3519CE7D63BECB664CBE1332EEF|D02AE49173BDAD56E4F88223707E56D3DEF4115C|02F38DFF731FF97CB039A1DA549E695E905BA208|1493269DE61F124AA69A316E3ADF34EBDBB200A4)$'
          gpg --batch --status-fd 1 --verify "$source_file.sig" "$source_file" \
            > "$RUNNER_TEMP/signature-status.log" 2>&1 || {
              cat "$RUNNER_TEMP/signature-status.log"; exit 1;
            }
          cat "$RUNNER_TEMP/signature-status.log"
          awk '/^\[GNUPG:\] VALIDSIG / { print $3 }' "$RUNNER_TEMP/signature-status.log" \
            | grep -Eq "$allowed" || {
              echo 'The signature is not from an allowed GnuPG release key.' >&2
              exit 1
            }
          tar -tf "$source_file" | head -n 5 || true

      - name: Compile GnuPG and all runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          # The upstream script passes --host=aarch64-apple-darwin (or x86_64)
          # to each library's configure script. SQLite 3.54 uses Autosetup,
          # which otherwise searches for a non-existent host-prefixed cc/gcc.
          # Select Apple's LLVM/Clang tools explicitly for both native runners.
          actual_arch="$(uname -m)"
          if [[ "$actual_arch" != "$ARCH" ]]; then
            echo "Wrong runner architecture: expected $ARCH, got $actual_arch" >&2
            exit 1
          fi
          export CC="$(xcrun --sdk macosx --find clang)"
          export CXX="$(xcrun --sdk macosx --find clang++)"
          export OBJC="$CC"
          export CC_FOR_BUILD="$CC"
          export AR="$(xcrun --sdk macosx --find ar)"
          export RANLIB="$(xcrun --sdk macosx --find ranlib)"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          for tool in "$CC" "$CXX" "$AR" "$RANLIB"; do
            test -x "$tool" || { echo "Unavailable tool: $tool" >&2; exit 1; }
          done
          echo "Target architecture: $ARCH"
          echo "Apple Clang: $CC"
          "$CC" --version
          echo "macOS SDK: $SDKROOT"
          # Catch toolchain selection and target issues before building libs.
          printf 'int main(void) { return 0; }\n' > "$RUNNER_TEMP/clang-smoke.c"
          "$CC" -arch "$ARCH" -isysroot "$SDKROOT" \
            "$RUNNER_TEMP/clang-smoke.c" -o "$RUNNER_TEMP/clang-smoke"
          file "$RUNNER_TEMP/clang-smoke"
          # Match libgcrypt's -Werror __thread feature probe with the chosen
          # target flags. Detect regressions before spending time on libraries.
          printf 'static __thread int state; int main(void) { state=7; return state!=7; }\n' \
            > "$RUNNER_TEMP/tls-smoke.c"
          if [[ "$ARCH" == arm64 ]]; then
            min_ver=11.0
          else
            min_ver=10.12
          fi
          "$CC" -arch "$ARCH" -isysroot "$SDKROOT" \
            "-mmacosx-version-min=$min_ver" -O3 -Werror \
            "$RUNNER_TEMP/tls-smoke.c" -o "$RUNNER_TEMP/tls-smoke"
          "$RUNNER_TEMP/tls-smoke"
          echo "Verified $ARCH compiler __thread TLS under -O3 -Werror"
          # Real compile/link probe to ensure ncursesw headers and static archive
          # belong together.  Never run this program: it needs a curses terminal.
          cat > "$RUNNER_TEMP/ncursesw-smoke.c" <<'C'
          #include <wchar.h>
          #include <curses.h>
          int main(void) { return addnwstr(L"x", 1); }
          C
          "$CC" -arch "$ARCH" -isysroot "$SDKROOT" \
            "-mmacosx-version-min=$min_ver" -Werror=implicit-function-declaration \
            -I"$GPGOSX_NCURSES_PREFIX/include/ncursesw" \
            "$RUNNER_TEMP/ncursesw-smoke.c" \
            "$GPGOSX_NCURSES_PREFIX/lib/libncursesw.a" \
            -o "$RUNNER_TEMP/ncursesw-smoke"
          if otool -L "$RUNNER_TEMP/ncursesw-smoke" | grep -E '/opt/homebrew/|/usr/local/(Cellar|opt)/'; then
            echo 'Homebrew dynamic runtime dependency leaked into ncursesw probe' >&2
            exit 1
          fi
          echo "Verified static $ARCH ncursesw and addnwstr"
          install_dir="/usr/local/gnupg-${GNUPG_VERSION%.*}"
          sudo mkdir -p "$install_dir"
          sudo chown "$(id -un)" "$install_dir"
          cd "$SOURCE_DIR"
          # Avoid Makefile's original `| tee` masking the actual build failure.
          bash ./build.sh "$ARCH" "$SOURCE_DIR/config-rel.sh" 2>&1 \
            | tee "$SOURCE_DIR/logs/build-${ARCH}.log"
          output="$GPGOSX_WORKDIR/${ARCH}-rel"
          test -x "$output/bin/gpg"
          file "$output/bin/gpg"
          "$output/bin/gpg" --version

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GnuPG-${{ inputs.gnupg_version }}-${{ matrix.arch }}-build-logs
          path: |
            ${{ runner.temp }}/gpgosx-source/logs/
            ${{ runner.temp }}/gnupg-work/${{ matrix.arch }}-build/libgcrypt-1.12.4/config.log
            ${{ runner.temp }}/gnupg-work/${{ matrix.arch }}-build/libgcrypt-1.12.4/config.h
            ${{ runner.temp }}/gnupg-work/${{ matrix.arch }}-build/pinentry-1.3.3/config.log
            ${{ runner.temp }}/gnupg-work/${{ matrix.arch }}-build/pinentry-1.3.3/config.h
            ${{ runner.temp }}/gnupg-work/${{ matrix.arch }}-build/pinentry-1.3.3/pinentry/Makefile
          if-no-files-found: ignore
          retention-days: 7

      - name: Archive architecture-specific build
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$GPGOSX_WORKDIR" -czf \
            "$RUNNER_TEMP/gnupg-${ARCH}.tar.gz" "${ARCH}-rel"

      - name: Upload architecture-specific build
        uses: actions/upload-artifact@v4
        with:
          name: gnupg-${{ matrix.arch }}-${{ inputs.gnupg_version }}
          path: ${{ runner.temp }}/gnupg-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  package:
    name: Package ARM64, x86_64 and Universal DMGs
    needs: build
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GNUPG_VERSION: ${{ inputs.gnupg_version }}

    steps:
      - name: Download architecture-specific builds
        uses: actions/download-artifact@v4
        with:
          pattern: gnupg-*-${{ inputs.gnupg_version }}
          path: ${{ runner.temp }}/archives
          merge-multiple: true

      - name: Merge binaries into a Universal 2 installer and DMG
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gnupg-package"
          mkdir -p "$work" "$work/rel" "$work/dmg-content" "$work/output" "$work/pkg-scripts"
          tar -C "$work" -xzf "$RUNNER_TEMP/archives/gnupg-arm64.tar.gz"
          tar -C "$work" -xzf "$RUNNER_TEMP/archives/gnupg-x86_64.tar.gz"

          arm="$work/arm64-rel"
          intel="$work/x86_64-rel"
          rel="$work/rel"
          prefix="/usr/local/gnupg-${GNUPG_VERSION%.*}"
          test -x "$arm/bin/gpg"
          test -x "$intel/bin/gpg"
          rsync -a "$arm/" "$rel/"

          count=0
          while IFS= read -r -d '' source; do
            relative="${source#"$arm"/}"
            dest="$rel/$relative"
            if file -b "$source" | grep -q 'Mach-O'; then
              counterpart="$intel/$relative"
              test -f "$counterpart" || {
                echo "Missing Intel counterpart: $relative" >&2; exit 1;
              }
              lipo -create "$counterpart" "$source" -output "$dest"
              architectures=" $(lipo -archs "$dest") "
              [[ "$architectures" == *' x86_64 '* && "$architectures" == *' arm64 '* ]] || {
                echo "Not universal: $relative ($architectures)" >&2; exit 1;
              }
              codesign --force --sign - "$dest"
              count=$((count + 1))
              if otool -L "$dest" | grep -E '/opt/homebrew/|/usr/local/(Cellar|opt)/|/gnupg-package/|/gnupg-work/'; then
                echo "Non-portable library reference in $relative" >&2
                exit 1
              fi
            elif [[ "$(head -c 2 "$source")" == '#!' ]]; then
              # Correct occasional ARM stage-directory paths in text scripts.
              if grep -Fq "$arm" "$dest"; then
                sed -i '' "s|$arm|$prefix|g" "$dest"
              fi
            fi
          done < <(find "$arm/bin" "$arm/lib" "$arm/libexec" -type f -print0)
          (( count > 0 )) || { echo 'No Mach-O files were merged.' >&2; exit 1; }
          echo "Merged $count Mach-O files"
          lipo -info "$rel/bin/gpg"
          codesign --verify "$rel/bin/gpg"

          # Unlike the original postinstall, never remove another GPG
          # installation or uninstall GPGTools on the user's machine.
          cat > "$work/pkg-scripts/postinstall" <<'POSTINSTALL'
          #!/bin/sh
          set -eu
          GPGOSX_INSTALLDIR=/usr/local/gnupg-2.5
          mkdir -p /usr/local/bin
          for name in gpg gpg2 gpgconf gpgsm gpg-agent gpg-connect-agent dirmngr pinentry; do
            target="$GPGOSX_INSTALLDIR/bin/$name"
            link="/usr/local/bin/$name"
            if [ -x "$target" ] && [ ! -e "$link" ] && [ ! -L "$link" ]; then
              ln -s "$target" "$link"
            fi
          done
          exit 0
          POSTINSTALL
          sed -i '' "s|^GPGOSX_INSTALLDIR=.*|GPGOSX_INSTALLDIR=$prefix|" \
            "$work/pkg-scripts/postinstall"
          chmod 0755 "$work/pkg-scripts/postinstall"

          pkgbuild \
            --root "$rel" \
            --install-location "$prefix" \
            --identifier 'org.community.gnupg.universal' \
            --version "$GNUPG_VERSION" \
            --scripts "$work/pkg-scripts" \
            "$work/GnuPG.pkg"
          productbuild --package "$work/GnuPG.pkg" "$work/dmg-content/Install.pkg"

          cat > "$work/dmg-content/README.txt" <<EOF
          GnuPG $GNUPG_VERSION for macOS (Universal 2: arm64 + x86_64)

          Open Install.pkg to install the command-line GnuPG tools.
          Installed files: $prefix
          Where possible, new command-line symlinks are created in /usr/local/bin.
          Existing tools and GPGTools installations are left untouched.

          This package is not Developer ID signed or notarized.
          EOF

          image="GnuPG-${GNUPG_VERSION}-universal.dmg"
          hdiutil create \
            -ov -format UDZO -fs HFS+ \
            -volname "GnuPG $GNUPG_VERSION" \
            -srcfolder "$work/dmg-content" \
            "$work/output/$image"
          hdiutil verify "$work/output/$image"
          (cd "$work/output" && shasum -a 256 "$image" > "$image.sha256")
          ls -lh "$work/output"

      - name: Build separate ARM64 and x86_64 installer DMGs
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gnupg-package"
          prefix="/usr/local/gnupg-${GNUPG_VERSION%.*}"
          test -x "$work/arm64-rel/bin/gpg"
          test -x "$work/x86_64-rel/bin/gpg"
          test -x "$work/pkg-scripts/postinstall"

          for arch in arm64 x86_64; do
            stage="$work/${arch}-rel"
            dmg_folder="$work/dmg-${arch}"
            mkdir -p "$dmg_folder"

            # A standalone DMG must contain only the requested architecture.
            machos=0
            while IFS= read -r -d '' binary; do
              if file -b "$binary" | grep -q 'Mach-O'; then
                found=" $(lipo -archs "$binary") "
                if [[ "$found" != " $arch " ]]; then
                  echo "Wrong architecture in ${binary#"$stage"/}: $found (expected $arch)" >&2
                  exit 1
                fi
                if otool -L "$binary" | grep -E '/opt/homebrew/|/usr/local/(Cellar|opt)/|/gnupg-package/|/gnupg-work/'; then
                  echo "Non-portable library reference: $binary" >&2
                  exit 1
                fi
                machos=$((machos + 1))
              fi
            done < <(find "$stage" -type f -print0)
            (( machos > 0 )) || {
              echo "No Mach-O files found for $arch" >&2
              exit 1
            }
            echo "Verified $machos $arch Mach-O files"

            pkgbuild \
              --root "$stage" \
              --install-location "$prefix" \
              --identifier "org.community.gnupg.${arch}" \
              --version "$GNUPG_VERSION" \
              --scripts "$work/pkg-scripts" \
              "$work/GnuPG-${arch}.pkg"
            productbuild --package "$work/GnuPG-${arch}.pkg" "$dmg_folder/Install.pkg"

            cat > "$dmg_folder/README.txt" <<EOF
          GnuPG $GNUPG_VERSION for macOS ($arch)

          This installer contains only $arch binaries; it is not Universal.
          Open Install.pkg to install the command-line GnuPG tools.
          Installed files: $prefix
          Where possible, new command-line symlinks are created in /usr/local/bin.
          Existing tools and GPGTools installations are left untouched.

          This package is not Developer ID signed or notarized.
          EOF

            image="GnuPG-${GNUPG_VERSION}-${arch}.dmg"
            hdiutil create \
              -ov -format UDZO -fs HFS+ \
              -volname "GnuPG $GNUPG_VERSION $arch" \
              -srcfolder "$dmg_folder" \
              "$work/output/$image"
            hdiutil verify "$work/output/$image"
            (cd "$work/output" && shasum -a 256 "$image" > "$image.sha256")
          done

          ls -lh "$work/output"

      - name: Upload ARM64 DMG and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: GnuPG-${{ inputs.gnupg_version }}-ARM64-DMG
          path: |
            ${{ runner.temp }}/gnupg-package/output/GnuPG-${{ inputs.gnupg_version }}-arm64.dmg
            ${{ runner.temp }}/gnupg-package/output/GnuPG-${{ inputs.gnupg_version }}-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 DMG and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: GnuPG-${{ inputs.gnupg_version }}-x86_64-DMG
          path: |
            ${{ runner.temp }}/gnupg-package/output/GnuPG-${{ inputs.gnupg_version }}-x86_64.dmg
            ${{ runner.temp }}/gnupg-package/output/GnuPG-${{ inputs.gnupg_version }}-x86_64.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Universal DMG and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: GnuPG-${{ inputs.gnupg_version }}-Universal-DMG
          path: |
            ${{ runner.temp }}/gnupg-package/output/GnuPG-${{ inputs.gnupg_version }}-universal.dmg
            ${{ runner.temp }}/gnupg-package/output/GnuPG-${{ inputs.gnupg_version }}-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 30
